apiVersion: v1
kind: Service
metadata:
  name: {{ include "vscgallery.fullname" . }}
  labels:
    {{- include "vscgallery.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "vscgallery.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
---
# Headless service required by the StatefulSet for stable pod DNS names.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vscgallery.fullname" . }}-headless
  labels:
    {{- include "vscgallery.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "vscgallery.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
